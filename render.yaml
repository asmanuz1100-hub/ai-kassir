services:
  - type: web
    name: ai-kassir-test
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-kassir-db
          property: connectionString
databases:
  - name: ai-kassir-db
    plan: free
    region: frankfurt
